<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treekipedia | The Tree of Knowledge</title>
    
    <!-- FAVICON (Browser Tab Icon) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌳</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background: #81d4fa;
        }
        .font-serif { font-family: 'Lora', serif; }
        
        .journal-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .journal-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        .journal-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(45, 30, 26, 0.2);
            border-radius: 10px;
        }

        /* Root growth animation */
        .link-tendril {
            stroke-dasharray: 2000;
            stroke-dashoffset: 2000;
            animation: grow-root 2s forwards cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
        }
        @keyframes grow-root {
            to { stroke-dashoffset: 0; }
        }

        .animate-cloud {
            animation: float 25s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(100px); }
        }

        /* Tree Swaying Animation */
        .tree-canopy {
            transform-origin: bottom center;
            animation: sway 8s infinite ease-in-out;
        }
        @keyframes sway {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(0.8deg); }
        }

        .node-item:hover .card-container div {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        #topic-summary p {
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col">

    <!-- HEADER -->
    <header class="absolute top-0 left-0 right-0 p-6 z-20 flex flex-col md:flex-row gap-6 items-center justify-between pointer-events-none">
        <div class="flex items-center gap-4 pointer-events-auto group">
            <div class="bg-white/95 p-3 rounded-2xl shadow-2xl transform group-hover:rotate-12 transition-transform duration-500">
                <i data-lucide="tree-pine" class="w-10 h-10 text-green-700"></i>
            </div>
            <div>
                <h1 class="text-3xl font-black tracking-tighter text-white drop-shadow-lg">Treekipedia</h1>
                <p class="text-[10px] text-white font-black tracking-[0.4em] uppercase opacity-90">Rooted in Fact</p>
            </div>
        </div>

        <div class="relative w-full max-lg pointer-events-auto">
            <i data-lucide="search" class="absolute left-6 top-1/2 -translate-y-1/2 w-5 h-5 text-sky-600"></i>
            <input 
                id="search-input"
                type="text" 
                placeholder="Plant a new topic tree..."
                class="w-full bg-white/95 border-none rounded-full py-4 pl-16 pr-20 focus:outline-none focus:ring-4 focus:ring-green-400/50 transition-all text-lg shadow-2xl text-slate-800 font-bold"
            >
            <div id="loader" class="hidden absolute right-6 top-1/2 -translate-y-1/2">
                <i data-lucide="loader-2" class="w-6 h-6 animate-spin text-green-600"></i>
            </div>
        </div>

        <div class="hidden md:block pointer-events-auto px-8 py-3.5 bg-green-800 text-white rounded-full font-black uppercase text-xs shadow-2xl border-4 border-white/20">
            Field Journal Active
        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- CANVAS (TREE) -->
        <main id="canvas-container" class="flex-1 relative cursor-grab active:cursor-grabbing bg-[#81d4fa]">
            <svg id="tree-svg" class="w-full h-full block"></svg>

            <!-- HUD -->
            <div class="absolute bottom-10 left-10 pointer-events-none">
                <div class="px-6 py-4 bg-white/95 border-l-8 border-green-700 rounded-2xl shadow-2xl flex items-center gap-4 text-xs font-black text-green-900 uppercase tracking-widest">
                    <i data-lucide="sprout" class="w-6 h-6 text-green-700 animate-bounce"></i>
                    Grow your knowledge by exploring the roots
                </div>
            </div>
        </main>

        <!-- SIDEBAR (JOURNAL) -->
        <aside class="w-[500px] h-full bg-[#fdfcf5] border-l-[12px] border-[#2d1e1a]/10 shadow-[-20px_0_60px_rgba(0,0,0,0.1)] overflow-y-auto journal-scrollbar z-10">
            <div id="journal-content" class="flex flex-col h-full p-12 pt-36">
                <div class="mb-14">
                    <div class="flex items-center gap-4 mb-6">
                        <div class="w-5 h-5 rounded-full bg-green-800/20 border-2 border-green-800 shadow-inner"></div>
                        <span class="text-xs font-black text-green-800 uppercase tracking-[0.6em]">Archival Record</span>
                    </div>
                    
                    <!-- Sidebar Icon and Title -->
                    <div class="flex items-start gap-4 mb-8">
                        <div id="sidebar-icon-container" class="p-4 bg-emerald-900/5 rounded-2xl border border-emerald-900/10">
                             <i id="sidebar-icon" data-lucide="tree-pine" class="w-10 h-10 text-emerald-800"></i>
                        </div>
                        <h3 id="topic-title" class="text-5xl font-serif font-black tracking-tighter leading-tight italic text-[#2d1e1a]">
                            Wikipedia
                        </h3>
                    </div>
                    
                    <div class="h-1.5 w-32 bg-green-800/10 rounded-full"></div>
                </div>

                <div id="topic-summary" class="prose max-w-none text-[#3e2b26] leading-[2.2] text-xl font-medium whitespace-pre-wrap">
                    Initializing field notes...
                </div>

                <div class="mt-auto pt-20">
                    <a id="wiki-link" href="#" target="_blank" class="group flex items-center justify-between w-full p-10 bg-[#2d1e1a]/5 border border-[#2d1e1a]/10 rounded-[40px] hover:bg-[#2d1e1a]/10 transition-all duration-500">
                        <div class="flex flex-col">
                            <span class="text-xs text-[#2d1e1a]/50 uppercase font-black tracking-widest mb-2">Original Manuscript</span>
                            <span class="text-2xl font-serif font-black text-[#2d1e1a]">View Online Archive</span>
                        </div>
                        <i data-lucide="arrow-up-right" class="w-10 h-10 group-hover:translate-x-2 group-hover:-translate-y-2 transition-transform text-green-800"></i>
                    </a>
                </div>
            </div>
        </aside>
    </div>

    <script>
        // CONFIG & STATE
        let centerTopic = "Wikipedia";
        let mainSeedTopic = "Wikipedia";
        let treeData = null;
        let isLoading = false;
        
        // In-memory cache to make re-searches and toggles instant
        const wikiCache = new Map();

        const svg = d3.select("#tree-svg");
        const container = d3.select("#canvas-container");
        let mainGroup, linksGroup, nodesGroup, zoom, decorationGroup, skyLayer;

        // HELPER: Get dynamic icon based on section name
        function getSectionIcon(name) {
            const lower = name.toLowerCase();
            if (name === mainSeedTopic) return 'tree-pine';
            if (lower.includes('etymology')) return 'languages';
            if (lower.includes('history')) return 'history';
            if (lower.includes('geography')) return 'map';
            if (lower.includes('politic') || lower.includes('government')) return 'landmark';
            if (lower.includes('economy')) return 'banknote';
            if (lower.includes('demographic') || lower.includes('population')) return 'users';
            if (lower.includes('culture')) return 'palette';
            if (lower.includes('infrastructure') || lower.includes('transport')) return 'bus';
            return 'book-open';
        }

        // Wikipedia Cleanup Engine - NUCLEAR EDITION
        function cleanWikiHtml(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            
            // 1. Remove all styles and scripts first
            doc.querySelectorAll('style, script').forEach(el => el.remove());
            
            // 2. Remove all Wikipedia UI and metadata noise
            const selectorsToRemove = [
                '.hatnote', '.metadata', '.navbox', '.vertical-navbox', 
                '.infobox', '.reference', '.mw-editsection', '.noprint', '.ambox', 
                '.mw-empty-elt', 'table', '.sistersitebox', '.thumb', '.mw-jump-link',
                '.mw-parser-output style', '.reflist', '.shortdescription'
            ];
            selectorsToRemove.forEach(s => doc.querySelectorAll(s).forEach(el => el.remove()));
            
            // 3. ULTRA-AGGRESSIVE: Remove anything that contains brackets and colons (CSS patterns)
            const allElements = doc.querySelectorAll('*');
            for (let i = allElements.length - 1; i >= 0; i--) {
                const el = allElements[i];
                const content = el.textContent || "";
                if ((content.includes('{') && content.includes('}') && content.includes(':')) || content.includes('.mw-')) {
                    el.remove();
                }
            }

            let text = doc.body.textContent || "";
            
            return text
                .replace(/\[edit\]/g, '')
                .replace(/\[\d+\]/g, '')
                .replace(/\n{3,}/g, '\n\n')
                .trim();
        }

        async function fetchTOC(title) {
            const cacheKey = `toc-${title}`;
            if (wikiCache.has(cacheKey)) return wikiCache.get(cacheKey);

            // List of sections to exclude from the tree
            const excludeList = [
                "See also", "Notes", "References", 
                "Further reading", "External links", "Play Audio",
                "Works cited", "Sources", "Citations"
            ];

            const url = `https://en.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(title)}&prop=sections&format=json&origin=*`;
            try {
                const res = await fetch(url).then(r => r.json());
                if (!res.parse || !res.parse.sections) return [];
                const sections = res.parse.sections
                    .filter(s => s.toclevel === 1 && !excludeList.includes(s.line))
                    .map(s => ({
                        name: s.line,
                        id: `sec-${s.index}-${title.replace(/\s/g, '_')}`,
                        children: [],
                        isSection: true,
                        sectionIndex: s.index
                    })).slice(0, 10);
                
                wikiCache.set(cacheKey, sections);
                return sections;
            } catch(e) { return []; }
        }

        async function fetchSectionLinks(pageTitle, sectionIndex, sectionName) {
            const cacheKey = `links-${pageTitle}-${sectionIndex}`;
            if (wikiCache.has(cacheKey)) return wikiCache.get(cacheKey);

            const url = `https://en.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(pageTitle)}&section=${sectionIndex}&prop=links|text&format=json&origin=*`;
            try {
                const res = await fetch(url).then(r => r.json());
                if (!res.parse) return [];
                const parser = new DOMParser();
                const doc = parser.parseFromString(res.parse.text['*'], 'text/html');
                const anchors = Array.from(doc.querySelectorAll('p a, li a'));
                const unique = new Set();
                const results = [];
                for (const a of anchors) {
                    const t = a.getAttribute('title');
                    if (t && !t.includes(':') && t.length > 2 && !unique.has(t)) {
                        unique.add(t);
                        results.push({
                            name: t,
                            id: `link-${t}-${sectionName}-${pageTitle}`.replace(/\s/g, '_'),
                            children: []
                        });
                    }
                }
                const filtered = results.slice(0, 7);
                wikiCache.set(cacheKey, filtered);
                return filtered;
            } catch(e) { return []; }
        }

        async function growTree(node, depth) {
            if (node.children && node.children.length > 0) {
                const findAndCollapse = (curr) => {
                    if (curr.id === node.id) { curr.children = []; return true; }
                    if (curr.children) for (let c of curr.children) if (findAndCollapse(c)) return true;
                    return false;
                };
                findAndCollapse(treeData);
                updateTree();
                return;
            }

            if (isLoading) return;
            setLoading(true);

            try {
                let children = [];
                let summary = "";
                
                if (depth === 1) {
                    const sectionTextKey = `sectionText-${treeData.name}-${node.sectionIndex}`;
                    
                    const [linksData, textData] = await Promise.all([
                        fetchSectionLinks(treeData.name, node.sectionIndex, node.name),
                        wikiCache.has(sectionTextKey) 
                            ? Promise.resolve(wikiCache.get(sectionTextKey))
                            : fetch(`https://en.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(treeData.name)}&section=${node.sectionIndex}&prop=text&format=json&origin=*`)
                                .then(r => r.json())
                                .then(res => {
                                    const cleaned = cleanWikiHtml(res.parse?.text?.['*'] || "");
                                    wikiCache.set(sectionTextKey, cleaned);
                                    return cleaned;
                                })
                    ]);
                    
                    children = linksData;
                    summary = textData;
                } else if (depth > 1) {
                    const deepKey = `deep-${node.name}`;
                    if (wikiCache.has(deepKey)) {
                        const cached = wikiCache.get(deepKey);
                        children = cached.children;
                        summary = cached.summary;
                    } else {
                        const res = await fetch(`https://en.wikipedia.org/w/api.php?action=query&prop=extracts|links&titles=${encodeURIComponent(node.name)}&pllimit=50&format=json&origin=*&explaintext=1&exintro=1`).then(r => r.json());
                        const pageId = Object.keys(res.query.pages)[0];
                        summary = res.query.pages[pageId].extract || "";
                        children = (res.query.pages[pageId].links || [])
                            .filter(l => l.ns === 0)
                            .map(l => ({ name: l.title, id: `deep-${l.title}-${node.name}`.replace(/\s/g, '_'), children: [] }))
                            .slice(0, 5);
                        
                        wikiCache.set(deepKey, { children, summary });
                    }
                }

                const findAndExpand = (curr) => {
                    if (curr.children && curr.children.some(c => c.id === node.id)) {
                        curr.children.forEach(s => {
                            if (s.id === node.id) s.children = children;
                            else s.children = [];
                        });
                        return true;
                    }
                    if (curr.children) for (let c of curr.children) if (findAndExpand(c)) return true;
                    return false;
                };
                findAndExpand(treeData);
                centerTopic = node.name;
                updateSidebar(node.name, summary);
                updateTree();
            } catch(e) {} finally {
                setLoading(false);
            }
        }

        function updateSidebar(title, summary) {
            document.getElementById('topic-title').innerText = title;
            document.getElementById('topic-summary').innerText = summary || "Details are being unhearted for this root segment.";
            document.getElementById('wiki-link').href = `https://en.wikipedia.org/wiki/${title}`;
            
            // Update Icon
            const iconName = getSectionIcon(title);
            const iconEl = document.getElementById('sidebar-icon');
            iconEl.setAttribute('data-lucide', iconName);
            lucide.createIcons();
        }

        function setLoading(val) {
            isLoading = val;
            document.getElementById('loader').classList.toggle('hidden', !val);
        }

        function initCanvas() {
            mainGroup = svg.append("g").attr("class", "main-container");
            const defs = svg.append("defs");
            
            defs.append("linearGradient").attr("id", "skyGradient").attr("x1", "0%").attr("y1", "0%").attr("x2", "0%").attr("y2", "100%")
                .selectAll("stop").data([{o: "0%", c: "#0288d1"}, {o: "100%", c: "#81d4fa"}]).enter().append("stop").attr("offset", d => d.o).attr("stop-color", d => d.c);
            
            defs.append("linearGradient").attr("id", "dirtGradient").attr("x1", "0%").attr("y1", "0%").attr("x2", "0%").attr("y2", "100%")
                .selectAll("stop").data([{o: "0%", c: "#3e2723"}, {o: "100%", c: "#1a0f0d"}]).enter().append("stop").attr("offset", d => d.o).attr("stop-color", d => d.c);

            const bgW = 30000;
            skyLayer = mainGroup.append("g").attr("class", "sky-layer");
            skyLayer.append("rect").attr("y", -5000).attr("x", -bgW/2).attr("width", bgW).attr("height", 5000).attr("fill", "url(#skyGradient)");
            
            const cloudG = skyLayer.append("g").attr("class", "svg-cloud");
            cloudG.append("path").attr("d", "M-100,-300 Q-80,-340 -40,-320 Q0,-360 40,-320 Q80,-340 100,-300 Z").attr("fill", "white").attr("opacity", 0.4);
            cloudG.append("path").attr("d", "M400,-450 Q420,-490 460,-470 Q500,-510 540,-470 Q580,-490 600,-450 Z").attr("fill", "white").attr("opacity", 0.3);
            cloudG.append("path").attr("d", "M-600,-200 Q-580,-240 -540,-220 Q-500,-260 -460,-220 Q-420,-240 -400,-200 Z").attr("fill", "white").attr("opacity", 0.2);

            mainGroup.append("rect").attr("y", 10).attr("x", -bgW/2).attr("width", bgW).attr("height", 15000).attr("fill", "url(#dirtGradient)");
            mainGroup.append("rect").attr("y", 0).attr("x", -bgW/2).attr("width", bgW).attr("height", 15).attr("fill", "#2e7d32");

            const decorGroup = mainGroup.append("g").attr("class", "decor");
            for(let i=0; i<400; i++){
                decorGroup.append("circle")
                    .attr("cx", (Math.random()-0.5)*bgW)
                    .attr("cy", 50 + Math.random()*10000)
                    .attr("r", 1 + Math.random()*4)
                    .attr("fill", "rgba(0,0,0,0.2)");
            }

            linksGroup = mainGroup.append("g").attr("class", "links-group");
            nodesGroup = mainGroup.append("g").attr("class", "nodes-group");

            zoom = d3.zoom().scaleExtent([0.05, 3]).on("zoom", (e) => mainGroup.attr("transform", e.transform));
            svg.call(zoom);
            const w = document.getElementById('canvas-container').clientWidth;
            // INCREASED INITIAL ZOOM to 1.0 (from 0.6) and adjusted Y translation
            svg.call(zoom.transform, d3.zoomIdentity.translate(w / 2, 150).scale(1.0));
        }

        function updateTree() {
            // TIGHTER NODE SPACING [260, 180] (previously [380, 320])
            const treeLayout = d3.tree().nodeSize([260, 180]);
            const root = d3.hierarchy(treeData);
            treeLayout(root);

            const t = svg.transition().duration(1000).ease(d3.easeCubicInOut);
            const linkGen = d3.linkVertical().x(d => d.x).y(d => d.y);

            linksGroup.selectAll("path")
                .data(root.links(), d => d.target.data.id)
                .join(
                    enter => enter.append("path").attr("class", "link-tendril").attr("fill", "none")
                        .attr("stroke", "#4e342e").attr("stroke-width", 3).attr("opacity", 0)
                        .attr("d", d => { const o = {x: d.source.x, y: d.source.y}; return linkGen({source: o, target: o}); })
                        .call(e => e.transition(t).attr("opacity", 1).attr("d", linkGen)),
                    update => update.call(u => u.transition(t).attr("d", linkGen)),
                    exit => exit.call(ex => ex.transition(t).attr("opacity", 0).remove())
                );

            nodesGroup.selectAll("g.node-item")
                .data(root.descendants(), d => d.data.id)
                .join(
                    enter => {
                        const e = enter.append("g").attr("class", "node-item").attr("cursor", "pointer")
                            .attr("transform", d => `translate(${d.parent ? d.parent.x : d.x}, ${d.parent ? d.parent.y : d.y})`)
                            .on("click", (ev, d) => growTree(d.data, d.depth));

                        e.each(function(d) {
                            const el = d3.select(this);
                            if (d.depth === 0) {
                                const tree = el.append("g").attr("class", "tree-graphic").attr("transform", "translate(0,0)");
                                tree.append("path").attr("d", "M-20,10 L20,10 L12,-100 L-12,-100 Z").attr("fill", "#5d4037");
                                const canopy = tree.append("g").attr("class", "tree-canopy");
                                canopy.append("circle").attr("r", 80).attr("cy", -110).attr("fill", "#388e3c");
                                canopy.append("circle").attr("r", 65).attr("cx", -70).attr("cy", -90).attr("fill", "#43a047");
                                canopy.append("circle").attr("r", 65).attr("cx", 70).attr("cy", -90).attr("fill", "#2e7d32");
                                canopy.append("circle").attr("r", 55).attr("cx", 0).attr("cy", -170).attr("fill", "#4caf50");
                            } else {
                                const stone = el.append("g").attr("class", "stone-graphic");
                                const r = d.depth === 1 ? 22 : 14;
                                stone.append("circle")
                                    .attr("r", r)
                                    .attr("fill", d.depth === 1 ? "#4e342e" : "#212121")
                                    .attr("stroke", "#6d4c41")
                                    .attr("stroke-width", 2);
                                stone.append("ellipse").attr("cx", -r/3).attr("cy", -r/3).attr("rx", r/3).attr("ry", r/5).attr("fill", "rgba(255,255,255,0.1)");
                            }
                        });

                        const fo = e.append("foreignObject").attr("x", -120).attr("y", 40).attr("width", 240).attr("height", 200).style("overflow", "visible");
                        fo.append("xhtml:div").attr("class", "card-container flex justify-center").html(d => `
                            <div class="p-4 rounded-2xl border-2 shadow-2xl backdrop-blur-xl transition-all duration-500 text-center text-sm font-black leading-tight w-[210px] min-h-[48px]
                                 ${d.depth === 0 ? 'bg-white text-green-900 border-green-700' : 'bg-[#2d1e1a]/95 text-[#efebe9] border-[#6d4c41]'}
                                 ${d.data.name === centerTopic ? 'ring-4 ring-green-400/50 scale-110' : ''}">
                                ${d.data.name}
                            </div>
                        `);
                        return e.transition(t).attr("transform", d => `translate(${d.x},${d.y})`).attr("opacity", 1);
                    },
                    update => update.call(u => {
                        u.transition(t).attr("transform", d => `translate(${d.x},${d.y})`);
                        u.select(".card-container div")
                            .attr("class", d => `p-4 rounded-2xl border-2 shadow-2xl backdrop-blur-xl transition-all duration-500 text-center text-sm font-black leading-tight w-[210px] min-h-[48px]
                                 ${d.depth === 0 ? 'bg-white text-green-900 border-green-700' : 'bg-[#2d1e1a]/95 text-[#efebe9] border-[#6d4c41]'}
                                 ${d.data.name === centerTopic ? 'ring-4 ring-green-400/50 scale-110' : ''}`);
                    }),
                    exit => exit.call(ex => ex.transition(t).attr("opacity", 0).remove())
                );
        }

        async function initSeed(title) {
            if (!title) return;
            setLoading(true);
            
            try {
                // Parallel fetching of Introduction and Table of Contents
                const [introRes, sections] = await Promise.all([
                    fetch(`https://en.wikipedia.org/w/api.php?action=query&prop=extracts&titles=${encodeURIComponent(title)}&format=json&origin=*&explaintext=1&exintro=1`).then(r => r.json()),
                    fetchTOC(title)
                ]);

                const pageId = Object.keys(introRes.query.pages)[0];
                const summary = introRes.query.pages[pageId].extract || "";
                
                mainSeedTopic = title;
                treeData = { name: title, id: `root-${title.replace(/\s/g, '_')}`, children: sections, isSeed: true };
                centerTopic = title;
                
                updateSidebar(title, summary);
                updateTree();
            } catch(e) {} finally {
                setLoading(false);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initCanvas();
            initSeed(centerTopic);
            lucide.createIcons();
            document.getElementById('search-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') initSeed(e.target.value);
            });
        });
    </script>
</body>
</html>
